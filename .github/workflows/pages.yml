name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
      - name: Copy static SEO pages
        shell: bash
        run: |
          cp CNAME build/web/CNAME
          mkdir -p build/web/docs build/web/verification
          cp static/docs/index.html build/web/docs/index.html
          cp static/verification/index.html build/web/verification/index.html
          TODAY=$(date -u +%Y-%m-%d)
          DOMAIN=$(tr -d '[:space:]' < CNAME)
          printf 'User-agent: *\nAllow: /\nSitemap: https://%s/sitemap.xml\n' "$DOMAIN" > build/web/robots.txt
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' \
            "  <url><loc>https://$DOMAIN/</loc><lastmod>$TODAY</lastmod></url>" \
            "  <url><loc>https://$DOMAIN/docs/</loc><lastmod>$TODAY</lastmod></url>" \
            "  <url><loc>https://$DOMAIN/verification/</loc><lastmod>$TODAY</lastmod></url>" \
            '</urlset>' > build/web/sitemap.xml
          cp build/web/index.html build/web/404.html
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: build/web
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
